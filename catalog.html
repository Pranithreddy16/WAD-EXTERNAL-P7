<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalog</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container py-5">

  <h1 class="text-center mb-5">Product Catalog</h1>

  <div class="row g-4">

    <div class="col-md-4">
      <div class="border rounded p-3 h-100">

        <h4>Product 1</h4>

        <p>High-quality item for daily use.</p>

        <p class="fw-bold">$10.00</p>

        <button class="btn btn-outline-primary w-100">
          Add to Cart
        </button>

      </div>
    </div>

    <div class="col-md-4">
      <div class="border rounded p-3 h-100">

        <h4>Product 2</h4>

        <p>Durable and affordable.</p>

        <p class="fw-bold">$15.00</p>

        <button class="btn btn-outline-primary w-100">
          Add to Cart
        </button>

      </div>
    </div>

    <div class="col-md-4">
      <div class="border rounded p-3 h-100">

        <h4>Product 3</h4>

        <p>Premium quality best seller.</p>

        <p class="fw-bold">$20.00</p>

        <button class="btn btn-outline-primary w-100">
          Add to Cart
        </button>

      </div>
    </div>

  </div>

  <div class="text-center mt-5">
    <a href="cart.html" class="btn btn-dark">
      Go to Cart
    </a>
  </div>

</div>

</body>
</html>
